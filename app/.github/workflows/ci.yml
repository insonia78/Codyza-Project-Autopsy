name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install and cache the Supabase CLI
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Start a temporary local database inside the runner
      - name: Start Local Supabase
        run: supabase db start

      # Run schema linter and tests (e.g., pgTAP if you have them)
      - name: Verify Migrations and Test
        run: |
          supabase db lint
          supabase test db

      # Optional: Verify that your local generated types match the schema
      - name: Verify Type Consistency
        run: |
          supabase gen types typescript --local > types.gen.ts
          if ! git diff --exit-code types.gen.ts; then
            echo "Database schema changes detected. Run 'supabase gen types' locally and commit the updated types.gen.ts file."
            exit 1
          fi
